<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Affaire de Groove</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #000;
    }

    .page {
      position: relative;
      width: 100%;
      max-width: 1080px;
      margin: auto;
    }

    .page img {
      display: block;
      width: 100%;
      height: auto;
    }

    .lien {
      position: absolute;
      display: block;
      cursor: pointer;
      z-index: 10;
    }

    /* Facebook */
    .facebook {
      left: 31%;
      top: 82%;
      width: 10%;
      height: 7%;
    }

    /* Instagram */
    .instagram {
      left: 43%;
      top: 82%;
      width: 10%;
      height: 7%;
    }

    /* YouTube */
    .youtube {
      left: 55%;
      top: 82%;
      width: 13%;
      height: 7%;
    }

    /* Adresse e-mail */
    .email {
      left: 30%;
      top: 89%;
      width: 40%;
      height: 7%;
    }
    .indication-reseaux,
.indication-email {
  position: absolute;
  left: 0;
  width: 100%;
  text-align: center;
  color: #f5e8c8;
  font-family: Georgia, serif;
  font-size: 14px;
  z-index: 5;
}

.indication-reseaux {
  top: 76%;
}

.indication-email {
  top: 86%;
}

  </style>
</head>

<body>

  <div class="page">

    <img src="Affaire%20de%20Groove.png" alt="Affaire de Groove">
<div class="indication-reseaux">
  Retrouvez-nous sur les réseaux — cliquez sur les logos
</div>
    <!-- FACEBOOK -->
    <a
      class="lien facebook"
      href="https://www.facebook.com/share/1YsyPKbd55/"
      target="_blank"
      aria-label="Facebook">
    </a>

    <!-- INSTAGRAM -->
    <a
      class="lien instagram"
      href=https://www.instagram.com/affaire_de_groove?stkn=MXVqNm5weTUxb2QyZg==
      aria-label="Instagram">
    </a>

    <!-- YOUTUBE -->
    <a
      class="lien youtube"
      href=https://youtube.com/@affairedegroove?si=tLdaKeii_kqdu4RV
      target="_blank"
      aria-label="YouTube">
    </a>
<div class="indication-email">
  Cliquez sur l’adresse pour nous contacter
</div>
    <!-- EMAIL -->
    <a
      class="lien email"
      href="mailto:affairedegroove@outlook.fr"
      aria-label="Envoyer un e-mail">
    </a>

  </div>

</body>
</html>
