<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Affaire de Groove</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #000;
    }

    .page {
      position: relative;
      width: 100%;
      max-width: 1080px;
      margin: auto;
    }

    .page img {
      display: block;
      width: 100%;
      height: auto;
    }

    .lien {
      position: absolute;
      display: block;
      cursor: pointer;
      z-index: 10;
    }

   

/* Logos réseaux sociaux */
.facebook {
    left: 73%;
    top: 88%;
    width: 4%;
    height: 4.5%;
}

.instagram {
    left: 80%;
    top: 88%;
    width: 4%;
    height: 4.5%;
}

.youtube {
    left: 87%;
    top: 88%;
    width: 4%;
    height: 4.5%;
}

.email {
    left: 94%;
    top: 88%;
    width: 4%;
    height: 4.5%;
}

    
    .indication-reseaux,
.indication-email {
  position: absolute;
  left: 0;
  width: 100%;
  text-align: center;
  color: #f5e8c8;
  font-family: Georgia, serif;
  font-size: 18px;
  z-index: 5;
}

.indication-reseaux {
  top: 81%;
}

.indication-email {
  top: 90%;
}
@media (max-width: 600px) {
  .indication-reseaux {
    top: 77%;
    font-size: 11px;
  }

  .indication-email {
    top: 96%;
    font-size: 11px;
  }
}
    /* CADRES DORES ET TAILLE IDENTIQUE DES LOGOS */

.facebook,
.instagram,
.youtube,
.email {
    width: 5%;
    height: 5%;
    box-sizing: border-box;
  }
   

/* Bloc réseaux sociaux */
.cadre-reseaux {
    position: absolute;
    right: 2%;
    bottom: 7%;
    width: 36%;
    min-height: 76px;
    padding: 12px 16px;

    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 13px;

    border: 2px solid #D4AF57;
    border-radius: 10px;
    box-sizing: border-box;
    z-index: 20;
}

/* Titre Follow us */
.titre-reseaux {
    color: #D4AF57;
    font-family: Georgia, serif;
    font-size: 16px;
    font-weight: bold;
    white-space: nowrap;
    margin-right: auto;
}

/* Alignement et taille identique des logos */
.cadre-reseaux .lien {
    position: static;
    display: block;
    flex: 0 0 38px;
    width: 38px;
    height: 38px;
}

.cadre-reseaux .facebook,
.cadre-reseaux .instagram,
.cadre-reseaux .youtube,
.cadre-reseaux .email {
    left: auto;
    top: auto;
    width: 38px;
    height: 38px;
}

.cadre-reseaux .lien img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
}



/* CORRECTION AFFICHAGE TELEPHONE */
@media screen and (max-width: 600px) {

  .cadre-reseaux {
    position: absolute !important;
    left: 4% !important;
    top: 86% !important;
    width: 92% !important;
    height: 76px !important;
    box-sizing: border-box !important;

    display: flex !important;
    flex-direction: row !important;
    align-items: center !important;
    justify-content: space-evenly !important;
    flex-wrap: nowrap !important;
    gap: 5px !important;
    padding: 8px !important;
  }

  .cadre-reseaux .titre-reseaux {
    position: static !important;
    width: auto !important;
    flex: 0 0 auto !important;
    white-space: nowrap !important;
    font-size: 14px !important;
    margin: 0 !important;
  }

  .cadre-reseaux .lien {
    position: static !important;
    left: auto !important;
    top: auto !important;
    width: 30px !important;
    height: 30px !important;
    flex: 0 0 30px !important;
    margin: 0 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
  }

  .cadre-reseaux .lien img {
    width: 100% !important;
    height: 100% !important;
    object-fit: contain !important;
    display: block !important;
    transform: none !important;
  }

}








  </style>
</head>

<body>

  <div class="page">

    <img src="nouvelle-photo2.png" alt="Affaire de Groove">
<div class="cadre-reseaux">

    <span class="titre-reseaux">Follow us</span>
    
    <!-- FACEBOOK -->
    <a
      class="lien facebook"
      href="https://www.facebook.com/share/1YsyPKbd55/"
      target="_blank"
      aria-label="Facebook">
     <img src="fb-logo.png"
     alt="Facebook"
     style="width:100%; height:100%; object-fit:contain;">
    </a>

    <!-- INSTAGRAM -->
    <a
      class="lien instagram"
      href=https://www.instagram.com/affaire_de_groove?stkn=MXVqNm5weTUxb2QyZg==
      aria-label="Instagram">
      <img src="insta-logo.png"
     alt="Instagram"
     style="width:100%; height:100%; object-fit:contain;">
    </a>

    <!-- YOUTUBE -->
    <a
      class="lien youtube"
      href=https://youtube.com/@affairedegroove?si=tLdaKeii_kqdu4RV
      target="_blank"
      aria-label="YouTube">
      <img src="youtube-logo.png" alt="YouTube"
style="width:100%; height:100%; object-fit:contain;">
    </a>
<!-- EMAIL -->
<a
  class="lien email"
  href="mailto:affairedegroove@outlook.fr"
  aria-label="Envoyer un e-mail">

<img src="mail-dore.png" alt="E-mail"
style="width:100%; height:100%; object-fit:contain;">

</a>
    

  </div>
<!-- BOUTON POUR ACCEDER AUX FORMULES -->
<div style="text-align:center; margin:30px auto;">
  <a href="reservation.html"
     style="display:inline-block;
            background:#c9a45c;
            color:#ffffff;
            padding:16px 30px;
            border-radius:8px;
            text-decoration:none;
            font-weight:bold;
            font-size:18px;">
    🎵 DÉCOUVRIR NOS FORMULES
  </a>
</div>
</body>
</html>
