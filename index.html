<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Affaire de Groove</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #000;
    }

    .page {
      position: relative;
      width: 100%;
      max-width: 1080px;
      margin: auto;
    }

    .page img {
      display: block;
      width: 100%;
      height: auto;
    }

    .lien {
      position: absolute;
      display: block;
      cursor: pointer;
      z-index: 10;
    }

   
/* Logos réseaux sociaux */
.facebook {
    left: 65%;
    top: 87%;
    width: 5%;
    height: 5%;
}

.instagram {
    left: 73%;
    top: 87%;
    width: 5%;
    height: 5%;
}

.youtube {
    left: 81%;
    top: 87%;
    width: 5%;
    height: 5%;
}

.email {
    left: 89%;
    top: 87%;
    width: 5%;
    height: 5%;
}


    
    .indication-reseaux,
.indication-email {
  position: absolute;
  left: 0;
  width: 100%;
  text-align: center;
  color: #f5e8c8;
  font-family: Georgia, serif;
  font-size: 18px;
  z-index: 5;
}

.indication-reseaux {
  top: 81%;
}

.indication-email {
  top: 90%;
}
@media (max-width: 600px) {
  .indication-reseaux {
    top: 77%;
    font-size: 11px;
  }

  .indication-email {
    top: 96%;
    font-size: 11px;
  }
}
    /* CADRES DORES ET TAILLE IDENTIQUE DES LOGOS */

.facebook,
.instagram,
.youtube,
.email {
    width: 5%;
    height: 5%;
    box-sizing: border-box;
  }
   
.cadre-reseaux {
    position: absolute;
    left: 62%;
    top: 78%;
    width: 35%;
    height: 18%;
    border: 2px solid #D4AF57;
    border-radius: 12px;
    box-sizing: border-box;
    pointer-events: none;
}

.cadre-reseaux::before {
    content: "Follow us";
    position: absolute;
    top: 10px;
    width: 100%;
    text-align: center;
    color: #D4AF57;
    font-family: Georgia, serif;
    font-size: 20px;
    font-weight: bold;
}



  </style>
</head>

<body>

  <div class="page">

    <img src="nouvelle-photo2.png" alt="Affaire de Groove">
<div class="cadre-reseaux"></div>
    
    <!-- FACEBOOK -->
    <a
      class="lien facebook"
      href="https://www.facebook.com/share/1YsyPKbd55/"
      target="_blank"
      aria-label="Facebook">
     <img src="fb-logo.png"
     alt="Facebook"
     style="width:100%; height:100%; object-fit:contain;">
    </a>

    <!-- INSTAGRAM -->
    <a
      class="lien instagram"
      href=https://www.instagram.com/affaire_de_groove?stkn=MXVqNm5weTUxb2QyZg==
      aria-label="Instagram">
      <img src="insta-logo.png"
     alt="Instagram"
     style="width:100%; height:100%; object-fit:contain;">
    </a>

    <!-- YOUTUBE -->
    <a
      class="lien youtube"
      href=https://youtube.com/@affairedegroove?si=tLdaKeii_kqdu4RV
      target="_blank"
      aria-label="YouTube">
      <img src="youtube-logo.png" alt="YouTube"
style="width:100%; height:100%; object-fit:contain;">
    </a>
<!-- EMAIL -->
<a
  class="lien email"
  href="mailto:affairedegroove@outlook.fr"
  aria-label="Envoyer un e-mail">

<img src="mail-dore.png" alt="E-mail"
style="width:100%; height:100%; object-fit:contain;">

</a>
    

  </div>
<!-- BOUTON POUR ACCEDER AUX FORMULES -->
<div style="text-align:center; margin:30px auto;">
  <a href="reservation.html"
     style="display:inline-block;
            background:#c9a45c;
            color:#ffffff;
            padding:16px 30px;
            border-radius:8px;
            text-decoration:none;
            font-weight:bold;
            font-size:18px;">
    🎵 DÉCOUVRIR NOS FORMULES
  </a>
</div>
</body>
</html>
